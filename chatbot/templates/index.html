<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weebo Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <!-- Sidebar dengan maskot dan teks sambutan -->
        <div class="sidebar">
            <img src="{{ url_for('static', filename='pngegg.png') }}" alt="Maskot" class="mascot">
            <h2>WEEBO</h2>
            <h3>siap membantu!</h3>
            <p>Halo! Aku Weebo, chatbot yang siap membantu. Silakan ketik pesanmu di kotak chat dan aku akan
                menjawabnya!</p><br>
            <h4>© 2025 Usman n Wahyou</h4>
        </div>

        <!-- Chat Container -->
        <div class="chat-container">
            <div class="chat-box" id="chat-box"></div>
            <div class="input-container">
                <input type="text" id="user-input" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">
                    <img src="static\send-paper.png" alt="Kirim" class="send-icon">
                </button>
            </div>
        </div>
    </div>

    <script>
        const botIconPath = "{{ url_for('static', filename='pngegg.png') }}";
        const userIconPath = "{{ url_for('static', filename='user.jpeg') }}";
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>


</html>
